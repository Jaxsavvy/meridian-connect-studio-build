<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEV-005 synthetic Asset Library</title>
<link rel="stylesheet" href="../../../../src/renderer/studio-assets/view.css">
<main id="assets"></main>
<aside aria-label="Synthetic failure controls">
<p>Development fixture controls — synthetic memory only.</p>
<button id="offline" type="button">Go offline</button>
<button id="conflict" type="button">Simulate another metadata edit</button>
<button id="host-switch" type="button">Host switch to project B</button>
<button id="host-signout" type="button">Host sign out</button>
<button id="host-revoke" type="button">Host session revoked</button>
<p id="fixture-status" role="status"></p>
</aside>
<script src="../../../../src/renderer/studio-assets/model.js"></script>
<script src="../../../../src/renderer/studio-assets/synthetic-service.js"></script>
<script src="../../../../src/renderer/studio-assets/controller.js"></script>
<script src="../../../../src/renderer/studio-assets/view.js"></script>
<script>
const projects=[{id:'synthetic-A',name:'Synthetic poster project A'},{id:'synthetic-B',name:'Synthetic project B — long project name for layout checks'}];
const service=new StudioSyntheticService.SyntheticService({projects:projects.map(p=>p.id)});
const controller=new StudioAssetController.Controller({service,projects});
document.getElementById('offline').onclick=()=>{service.offline=!service.offline;document.getElementById('offline').textContent=service.offline?'Restore connection':'Go offline';document.getElementById('fixture-status').textContent=service.offline?'Synthetic adapter offline':'Synthetic adapter online';};
document.getElementById('conflict').onclick=async()=>{
const scope=controller.snapshot();const asset=scope.assets.find(a=>a.id===scope.selectedId);if(!asset)return;
try{await service.metadata({projectId:scope.project.id,assetId:asset.id,revision:asset.revision,name:'Synthetic collaborator correction',tags:asset.tags,description:asset.description,section:asset.section});document.getElementById('fixture-status').textContent='Synthetic collaborator revision saved; the next stale save will conflict.';}
catch(error){document.getElementById('fixture-status').textContent='Synthetic edit failed: '+error.code;}
};
(async()=>{
await service.import({projectId:'synthetic-A',filename:'synthetic-poster.txt',mediaType:'text/plain',bytes:new TextEncoder().encode('Synthetic poster: blue circle on white.'),idempotencyKey:'demo-seed'});
const assetView=StudioAssetView.mount(document.getElementById('assets'),controller);
document.getElementById('host-switch').onclick=async()=>{const allowed=await assetView.setProject('synthetic-B');document.getElementById('fixture-status').textContent=allowed?'Host switch allowed':'Host switch cancelled';};
document.getElementById('host-signout').onclick=async()=>{const allowed=await assetView.signOut();document.getElementById('fixture-status').textContent=allowed?'Host sign-out allowed':'Host sign-out cancelled';};
document.getElementById('host-revoke').onclick=()=>{assetView.clearContext();document.getElementById('fixture-status').textContent='Host session revoked; scoped data cleared';};
})();
</script>
</html>
