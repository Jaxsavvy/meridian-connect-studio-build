<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meridian Connect - Popout</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="bg-ambient"></div>
  <div class="popout-shell">
    <header class="popout-topbar">
      <div class="popout-title">
        <span id="popout-icon">🖥️</span>
        <span id="popout-heading">Panel View</span>
        <span class="panel-badge">POPOUT</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span id="popout-user-label" style="font-size: 11px; color: var(--ash);">User: Connecting</span>
        <button type="button" id="btn-dock-this" class="btn-dock-back" style="padding: 4px 10px; font-size: 11px;">↙ Dock to Main Window</button>
      </div>
    </header>
    <main id="popout-content" class="popout-content"></main>
  </div>
  <script src="popout.js"></script>
</body>
</html>
